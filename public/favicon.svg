<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- fond -->
  <rect width="64" height="64" fill="#780000"/>
  <!-- la botte, angle droit, très tract des années 90 -->
  <path d="M18 8 h12 v20 l16 8 v8 l-28 0 z" fill="#fdf6e3" stroke="#1b1b1b" stroke-width="3"/>
  <!-- l'impact : les petites lignes de mouvement -->
  <g stroke="#0d6efd" stroke-width="3" stroke-linecap="round">
    <line x1="50" y1="20" x2="58" y2="16"/>
    <line x1="52" y1="30" x2="60" y2="30"/>
  </g>
</svg>